name: fusion_fiesta
description: "FusionFiesta - Cross-Platform College Event Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Official Firebase SDK Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # State Management & Local Preferences
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Date, Time & Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.5

  # Charts & Dashboards
  fl_chart: ^0.69.0

  # QR Code Generation
  qr_flutter: ^4.1.0

  # PDF Generation & Printing for Certificates & Reports
  pdf: ^3.11.1
  printing: ^5.13.2

  # Excel & CSV Exports
  excel: ^4.0.6
  csv: ^6.0.0

  # Maps & Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
